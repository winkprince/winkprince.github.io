<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cherry🤎小张张</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #webcam {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            display: none;
            z-index: -1;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        /* 优化手机端 UI 布局，防止被刘海屏遮挡，并缩小字体 */
        #ui-overlay {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: calc(10px + env(safe-area-inset-left));
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.7);
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            max-width: 180px;
        }

        .gesture-badge {
            display: inline-block;
            padding: 2px 6px;
            background: #004444;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 3px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 16px;
            z-index: 100;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
            width: 80%;
        }
    </style>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>

    <div id="loading">高清 WebGL 流体场及手势模型初始化中...<br><span style="font-size:12px;opacity:0.7;">请允许摄像头权限</span></div>
    <video id="webcam" autoplay playsinline></video>
    <div id="canvas3d"></div>

    <div id="ui-overlay">
        <div>粒子数量: <b id="particle-count-txt">16,000</b></div>
        <div>当前手势: <span id="gesture-txt" class="gesture-badge">空中飘荡 (NONE)</span></div>
        <div>深度缩放: <span id="depth-txt">1.00</span></div>
        <div>风暴强度: <span id="storm-txt">0.00</span></div>
    </div>

    <script>
        // ==========================================
        // 1. 全局配置与移动端自适应
        // ==========================================
        // 检测是否为移动端
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // 手机端将粒子数降低至 8000 确保 60帧 丝滑度，PC 保持 16000
        const PARTICLE_COUNT = isMobile ? 8000 : 16000;
        document.getElementById('particle-count-txt').innerText = PARTICLE_COUNT.toLocaleString();

        let scene, camera, renderer, instancedMesh;
        let videoElement, cameraHelper;
        let hands;

        const pos = new Float32Array(PARTICLE_COUNT * 3);
        const targetPos = new Float32Array(PARTICLE_COUNT * 3);
        const vel = new Float32Array(PARTICLE_COUNT * 3);
        const noiseOffsets = new Float32Array(PARTICLE_COUNT * 3);

        let currentGesture = "NONE";
        let lastGesture = "NONE";
        let handPresent = false;
        let handCenter = new THREE.Vector3();
        let lastHandCenter = new THREE.Vector3();
        let handSpeed = 0;
        let depthScale = 1.0;
        let targetDepthScale = 1.0;
        let globalTime = 0;

        // 离线 Canvas（用于文字采样）
        const textCanvas = document.createElement('canvas');
        const textCtx = textCanvas.getContext('2d');
        textCanvas.width = 256;
        textCanvas.height = 256;

        // 用于计算手机端摄像头和屏幕比例的缩放因子
        let viewScaleX = 26;
        let viewScaleY = 26;

        // ==========================================
        // 2. 形状几何与数学方程
        // ==========================================
        function getCloverPoint(t) {
            const theta = t * Math.PI * 2;
            const r = 4.5 + 3.5 * Math.cos(3 * theta);
            const z = (Math.random() - 0.5) * 1.5 * Math.sin(3 * theta);
            return new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), z);
        }

        function getStarPoint(t) {
            const angle = t * Math.PI * 2 * 2;
            const r_star = 4 + 4 * Math.cos(5 * t * Math.PI * 2);
            return new THREE.Vector3(r_star * Math.cos(t * Math.PI * 2), r_star * Math.sin(t * Math.PI * 2), (Math.random() - 0.5) * 0.2);
        }

        function getHeartPoint(t) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = t * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(theta), 3) * Math.sin(phi);
            const y = (13 * Math.cos(theta) - 5 * Math.cos(2 * theta) - 2 * Math.cos(3 * theta) - Math.cos(4 * theta)) * Math.sin(phi);
            const z = 10 * Math.cos(phi);
            return new THREE.Vector3(x * 0.45, y * 0.45, z * 0.45);
        }

        function generateTextTargets(text) {
            textCtx.clearRect(0, 0, 256, 256);
            textCtx.fillStyle = '#ffffff';
            textCtx.font = 'bold 24px sans-serif';
            textCtx.textAlign = 'center';
            textCtx.textBaseline = 'middle';
            textCtx.fillText(text, 128, 128);

            const imgData = textCtx.getImageData(0, 0, 256, 256).data;
            const validPoints = [];
            for (let y = 0; y < 256; y += 1) {
                for (let x = 0; x < 256; x += 1) {
                    const idx = (y * 256 + x) * 4;
                    if (imgData[idx] > 100) {
                        validPoints.push(new THREE.Vector3(
                            (x - 128) * 0.09,
                            -(y - 128) * 0.09,
                            (Math.random() - 0.5) * 0.1
                        ));
                    }
                }
            }
            return validPoints;
        }

        const textPointsCache = generateTextTargets("cherry 小张张");

        function transformToShape(shapeName) {
            currentGesture = shapeName;
            let uiText = shapeName;
            if (shapeName === "NONE") uiText = "空中飘荡 (NONE)";
            if (shapeName === "CLOVER_3") uiText = "三叶草绽放 (3FINGERS)";
            document.getElementById('gesture-txt').innerText = uiText;

            if (currentGesture !== lastGesture) {
                triggerExplosion();
                lastGesture = currentGesture;
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let p = new THREE.Vector3();
                const t = i / PARTICLE_COUNT;

                switch (shapeName) {
                    case "CLOVER_3":
                        p = getCloverPoint(t);
                        break;
                    case "OPEN_HAND":
                        p = getHeartPoint(t);
                        break;
                    case "VICTORY":
                        if (textPointsCache.length > 0) {
                            const cachedP = textPointsCache[i % textPointsCache.length];
                            p.set(cachedP.x, cachedP.y, cachedP.z);
                        }
                        break;
                    case "FIST":
                        const u = Math.random();
                        const v = Math.random();
                        const theta = u * 2.0 * Math.PI;
                        const phi = Math.acos(2.0 * v - 1.0);
                        const r = Math.cbrt(Math.random()) * 1.5;
                        p.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                        break;
                    case "INDEX_FINGER":
                        p = getStarPoint(t);
                        break;
                    case "THUMB_UP":
                        p = getHeartPoint(t).multiplyScalar(0.6);
                        break;
                    default:
                        return;
                }

                targetPos[i * 3] = p.x;
                targetPos[i * 3 + 1] = p.y;
                targetPos[i * 3 + 2] = p.z;
            }
        }

        function triggerExplosion() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const expForce = 20.0 + Math.random() * 25.0;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                vel[i * 3] += expForce * Math.sin(phi) * Math.cos(theta);
                vel[i * 3 + 1] += expForce * Math.sin(phi) * Math.sin(theta);
                vel[i * 3 + 2] += expForce * Math.cos(phi);
            }
        }

        // ==========================================
        // 3. Three.js 初始化与视口适配
        // ==========================================
        function initThree() {
            const container = document.getElementById('canvas3d');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 24;

            renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: "high-performance" });
            // 限制手机端的最大像素比为 2 就可以了，设为 3 极其消耗手机 GPU 且肉眼看不出区别
            const pixelRatio = Math.min(window.devicePixelRatio, 2);
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 稍微调大一点点手机端的粒子物理尺寸（从0.05调到0.06），弥补分辨率调低后的视觉感
            const geometry = new THREE.IcosahedronGeometry(isMobile ? 0.06 : 0.05, 1);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, PARTICLE_COUNT);

            const dummy = new THREE.Object3D();
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 35;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 35;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 20;

                targetPos[i * 3] = pos[i * 3];
                targetPos[i * 3 + 1] = pos[i * 3 + 1];
                targetPos[i * 3 + 2] = pos[i * 3 + 2];

                noiseOffsets[i * 3] = Math.random() * Math.PI * 2;
                noiseOffsets[i * 3 + 1] = Math.random() * Math.PI * 2;
                noiseOffsets[i * 3 + 2] = Math.random() * Math.PI * 2;

                dummy.position.set(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }

            scene.add(instancedMesh);
            window.addEventListener('resize', onWindowResize);
            onWindowResize(); // 初始化算一次比例
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            
            const pixelRatio = Math.min(window.devicePixelRatio, 2);
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(width, height);

            // 核心手机适配逻辑：根据手机屏幕动态解算 3D 空间的映射范围
            // 确保无论手机是小屏、大屏、横屏、竖屏，手势定位都不发生拉伸形变
            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const visibleHeight = 2 * Math.tan(vFOV / 2) * camera.position.z;
            const visibleWidth = visibleHeight * camera.aspect;
            
            viewScaleX = visibleWidth;
            viewScaleY = visibleHeight;
        }

        // ==========================================
        // 4. MediaPipe 手势算法（前置摄像头适配）
        // ==========================================
        function initMediaPipe() {
            videoElement = document.getElementById('webcam');
            hands = new Hands({
                locateFile: (file) => `https://unpkg.com/@mediapipe/hands/${file}`
            });

            // 降低手机端模型复杂度（modelComplexity: 0），极大缓解手机发烫和卡顿
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: isMobile ? 0 : 1, 
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            // 手机端调用前置摄像头，并请求最适合的流分辨率
            cameraHelper = new Camera(videoElement, {
                onFrame: async () => { await hands.send({ image: videoElement }); },
                width: isMobile ? 480 : 640,
                height: isMobile ? 640 : 480,
                facingMode: 'user'
            });
            
            cameraHelper.start().then(() => {
                document.getElementById('loading').style.display = 'none';
            }).catch(err => {
                document.getElementById('loading').innerHTML = "摄像头启动失败<br><span style='font-size:12px;'>请检查浏览器权限设置</span>";
                console.error(err);
            });
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handPresent = true;
                const landmarks = results.multiHandLandmarks[0];

                const wrist = landmarks[0];
                lastHandCenter.copy(handCenter);
                
                // 核心适配：完美映射 MediaPipe 的归一化坐标 [0,1] 到 Three.js 的视口边界内
                handCenter.set(
                    (wrist.x - 0.5) * -viewScaleX, 
                    (wrist.y - 0.5) * -viewScaleY, 
                    0
                );

                const palmSize = getDistance(landmarks[0], landmarks[9]);
                // 适配手机端较近的手掌距离
                targetDepthScale = THREE.MathUtils.mapLinear(palmSize, 0.15, 0.45, 0.6, 1.8);
                targetDepthScale = THREE.MathUtils.clamp(targetDepthScale, 0.5, 2.0);

                const distanceMoved = lastHandCenter.distanceTo(handCenter);
                handSpeed = distanceMoved * 0.3 + handSpeed * 0.7;

                // 优化后的手指开关判定
                const isThumbOpen = landmarks[4].y < landmarks[3].y && landmarks[4].x < landmarks[2].x;
                const isIndexOpen = landmarks[8].y < landmarks[6].y;
                const isMiddleOpen = landmarks[12].y < landmarks[10].y;
                const isRingOpen = landmarks[16].y < landmarks[14].y;
                const isPinkyOpen = landmarks[20].y < landmarks[18].y;

                const openedFingersCount = (isThumbOpen ? 1 : 0) + (isIndexOpen ? 1 : 0) + (isMiddleOpen ? 1 : 0) + (isRingOpen ? 1 : 0) + (isPinkyOpen ? 1 : 0);

                if (openedFingersCount === 3) {
                    transformToShape("CLOVER_3");
                } else if (isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen) {
                    transformToShape("OPEN_HAND");
                } else if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                    transformToShape("VICTORY");
                } else if (openedFingersCount === 0) {
                    transformToShape("FIST");
                } else if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                    transformToShape("INDEX_FINGER");
                } else if (isThumbOpen && !isIndexOpen && !isMiddleOpen && !isRingOpen) {
                    transformToShape("THUMB_UP");
                } else {
                    transformToShape("NONE");
                }
            } else {
                handPresent = false;
                handSpeed *= 0.8;
                transformToShape("NONE");
            }
        }

        // ==========================================
        // 5. 核心流体物理引擎
        // ==========================================
        const dummy = new THREE.Object3D();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // 限制单帧最大时间步长，防止手机卡顿瞬间导致粒子直接“飞出宇宙”
            const dt = Math.min(clock.getDelta(), 0.03);
            globalTime += dt * 0.8;

            depthScale += (targetDepthScale - depthScale) * 0.15;
            document.getElementById('depth-txt').innerText = depthScale.toFixed(2);
            document.getElementById('storm-txt').innerText = handSpeed.toFixed(2);

            if (handPresent) {
                instancedMesh.scale.set(depthScale, depthScale, depthScale);
                instancedMesh.position.lerp(new THREE.Vector3(handCenter.x * 0.25, handCenter.y * 0.25, 0), 0.1);
            } else {
                targetDepthScale = 1.0;
                instancedMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05);
                instancedMesh.position.lerp(new THREE.Vector3(0, 0, 0), 0.05);
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                let px = pos[i3], py = pos[i3 + 1], pz = pos[i3 + 2];
                let vx = vel[i3], vy = vel[i3 + 1], vz = vel[i3 + 2];
                let tx = targetPos[i3], ty = targetPos[i3 + 1], tz = targetPos[i3 + 2];

                let ax = 0, ay = 0, az = 0;

                if (currentGesture === "NONE") {
                    const nX = noiseOffsets[i3];
                    const nY = noiseOffsets[i3 + 1];
                    const nZ = noiseOffsets[i3 + 2];

                    const windX = Math.sin(globalTime * 0.5 + nY) * 2.5 + Math.cos(globalTime * 0.3 + nZ) * 1.5;
                    const windY = Math.cos(globalTime * 0.4 + nX) * 2.5 + Math.sin(globalTime * 0.6 + nZ) * 1.5;
                    const windZ = Math.sin(globalTime * 0.7 + nX) * 1.5;

                    ax = windX;
                    ay = windY;
                    az = windZ;
                } else {
                    ax = (tx - px) * 34.0;
                    ay = (ty - py) * 34.0;
                    az = (tz - pz) * 34.0;
                }

                if (handPresent && handSpeed > 0.4) {
                    const hX = handCenter.x / depthScale;
                    const hY = handCenter.y / depthScale;
                    const dx = px - hX;
                    const dy = py - hY;
                    const dz = pz - 0;
                    const distSq = dx * dx + dy * dy + dz * dz + 0.1;

                    if (distSq < 160) {
                        const forceMagnitude = (handSpeed * 45.0) / distSq;
                        ax += dx * forceMagnitude;
                        ay += dy * forceMagnitude;
                        az += dz * forceMagnitude;
                    }
                }

                const dampingCoeff = (currentGesture === "NONE") ? 2.0 : 5.5;
                const damping = Math.max(0.0, 1.0 - dampingCoeff * dt);
                vx = (vx + ax * dt) * damping;
                vy = (vy + ay * dt) * damping;
                vz = (vz + az * dt) * damping;

                px += vx * dt;
                py += vy * dt;
                pz += vz * dt;

                if (currentGesture === "NONE") {
                    const dSq = px * px + py * py + pz * pz;
                    if (dSq > 900) {
                        px *= 0.98; py *= 0.98; pz *= 0.98;
                    }
                }

                pos[i3] = px; pos[i3 + 1] = py; pos[i3 + 2] = pz;
                vel[i3] = vx; vel[i3 + 1] = vy; vel[i3 + 2] = vz;

                dummy.position.set(px, py, pz);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }

            instancedMesh.instanceMatrix.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // ==========================================
        // 6. 自动运行入口
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            initThree();
            initMediaPipe();
            animate();
        });
    </script>
</body>

</html>
