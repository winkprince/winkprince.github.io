<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快餐店柜台 3D 建模展示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#0d0d1a;overflow:hidden;color:#c8c8d8}
canvas{display:block}

#header{
  position:fixed;top:0;left:0;right:0;height:48px;
  background:rgba(13,13,26,0.88);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;padding:0 24px;z-index:100;
  justify-content:space-between;
}
#header h1{font-size:14px;font-weight:500;letter-spacing:3px;color:#7a7a90}
#header h1 b{color:#4a9eff;font-weight:700}

#panel{
  position:fixed;top:60px;right:14px;width:210px;
  background:rgba(16,16,30,0.92);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.07);border-radius:10px;
  padding:14px;z-index:100;
}
.zone-card{
  padding:10px 12px;border-radius:7px;margin-bottom:8px;
  background:rgba(255,255,255,0.025);transition:background .2s;
}
.zone-card:last-child{margin-bottom:0}
.zone-card:hover{background:rgba(255,255,255,0.05)}
.z-head{display:flex;align-items:center;gap:8px}
.z-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.z-name{font-size:13px;font-weight:500}
.z-cnt{font-size:11px;color:#555;margin-top:4px;padding-left:18px;
  font-family:'JetBrains Mono',monospace}

#toolbar{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:100;
}
.tb{
  background:rgba(16,16,30,0.88);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);border-radius:7px;
  padding:8px 16px;font-size:12px;color:#888;cursor:pointer;
  font-family:'Noto Sans SC',sans-serif;transition:all .2s;
  user-select:none;
}
.tb:hover{color:#ccc;border-color:rgba(255,255,255,0.2);
  background:rgba(30,30,50,0.95)}
.tb:active{transform:scale(0.96)}
.tb.accent{color:#4a9eff;border-color:rgba(74,158,255,0.25)}

#hint{
  position:fixed;bottom:64px;left:50%;transform:translateX(-50%);
  font-size:11px;color:#3a3a50;z-index:100;white-space:nowrap;
  font-family:'JetBrains Mono',monospace;letter-spacing:0.5px;
}

#tip{
  position:fixed;background:rgba(6,6,16,0.92);
  border:1px solid rgba(255,255,255,0.1);border-radius:6px;
  padding:5px 12px;font-size:12px;pointer-events:none;
  display:none;z-index:200;white-space:nowrap;
  font-family:'JetBrains Mono',monospace;
}
</style>
</head>
<body>

<div id="header">
  <h1>FAST <b>FOOD</b> COUNTER &mdash; 3D MODELING</h1>
  <span style="font-size:11px;color:#444;font-family:'JetBrains Mono',monospace">34 CONTAINERS</span>
</div>

<div id="panel">
  <div class="zone-card">
    <div class="z-head"><div class="z-dot" style="background:#4a9eff"></div><div class="z-name">凉菜区</div></div>
    <div class="z-cnt">8 containers &middot; 2&times;4</div>
  </div>
  <div class="zone-card">
    <div class="z-head"><div class="z-dot" style="background:#ff6b4a"></div><div class="z-name">小炒区</div></div>
    <div class="z-cnt">18 containers &middot; 2&times;9</div>
  </div>
  <div class="zone-card">
    <div class="z-head"><div class="z-dot" style="background:#4aff8b"></div><div class="z-name">小吃区</div></div>
    <div class="z-cnt">8 containers &middot; 2&times;4</div>
  </div>
</div>

<div id="toolbar">
  <div class="tb" id="btnPersp">透视</div>
  <div class="tb" id="btnTop">俯视</div>
  <div class="tb" id="btnFront">正面</div>
  <div class="tb" id="btnSide">侧面</div>
  <div class="tb accent" id="btnReset">重置</div>
</div>

<div id="hint">左键拖拽旋转 · 右键平移 · 滚轮缩放 · 左键点击小框拖拽移动</div>
<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";

/* ============ CONFIGURATION ============ */
var CW = 0.32, CD = 0.22, CH = 0.10;   // container dimensions
var CS = 0.38, RS = 0.28;               // column/row step
var CL = 7.2, CBL = 1.1;               // counter length/width
var CAB = 0.65, SFH = 0.04;            // cabinet height, surface thickness
var WLH = 0.13, WLT = 0.02;            // wall height, wall thickness
var SY = CAB + SFH;                     // surface top Y
var CY = SY + CH / 2 + 0.005;          // container center Y
var ZG = 0.14;                          // gap between zones

var ZDEFS = [
  { name: "凉菜区", cols: 4, rows: 2, color: 0x4a9eff, hex: "#4a9eff" },
  { name: "小炒区", cols: 9, rows: 2, color: 0xff6b4a, hex: "#ff6b4a" },
  { name: "小吃区", cols: 4, rows: 2, color: 0x4aff8b, hex: "#4aff8b" }
];

/* calculate zone layout */
var totalW = 0;
ZDEFS.forEach(function(z, i) {
  z.w = (z.cols - 1) * CS + CW;
  totalW += z.w + (i < ZDEFS.length - 1 ? ZG : 0);
});
var zx = -totalW / 2;
ZDEFS.forEach(function(z, i) {
  z.sx = zx;
  z.ex = zx + z.w;
  z.cx = zx + z.w / 2;
  zx += z.w + (i < ZDEFS.length - 1 ? ZG : 0);
});

/* ============ SCENE ============ */
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0e1c);
scene.fog = new THREE.FogExp2(0x0e0e1c, 0.032);

var camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6, 5, 8);

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

var ctrl = new THREE.OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.07;
ctrl.target.set(0, 0.5, 0);
ctrl.minDistance = 2.5;
ctrl.maxDistance = 16;
ctrl.maxPolarAngle = Math.PI / 2.05;
ctrl.update();

/* ============ LIGHTS ============ */
scene.add(new THREE.AmbientLight(0x303050, 0.45));
scene.add(new THREE.HemisphereLight(0x5060a0, 0x1a1010, 0.25));

var keyLight = new THREE.DirectionalLight(0xfff4e0, 0.75);
keyLight.position.set(5, 10, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

var fillLight = new THREE.DirectionalLight(0x5577cc, 0.2);
fillLight.position.set(-6, 5, -4);
scene.add(fillLight);

var rimLight = new THREE.DirectionalLight(0xff7744, 0.12);
rimLight.position.set(0, 3, -8);
scene.add(rimLight);

/* ============ ENVIRONMENT ============ */
var gndMat = new THREE.MeshStandardMaterial({ color: 0x12121c, roughness: 0.95, metalness: 0.05 });
var gnd = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), gndMat);
gnd.rotation.x = -Math.PI / 2;
gnd.receiveShadow = true;
scene.add(gnd);

var grid = new THREE.GridHelper(30, 60, 0x22223a, 0x181830);
grid.position.y = 0.001;
scene.add(grid);

/* ============ COUNTER ============ */
var cg = new THREE.Group();
scene.add(cg);

function addBox(w, h, d, mat, x, y, z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  cg.add(m);
  return m;
}

var cMat = new THREE.MeshStandardMaterial({ color: 0xb0b0b8, roughness: 0.38, metalness: 0.62 });
var sMat = new THREE.MeshStandardMaterial({ color: 0xe2e2e6, roughness: 0.22, metalness: 0.50 });
var wMat = new THREE.MeshStandardMaterial({ color: 0xbdbdc5, roughness: 0.28, metalness: 0.65, transparent: true, opacity: 0.82 });
var dMat = new THREE.MeshStandardMaterial({ color: 0xd5d5da, roughness: 0.2, metalness: 0.7 });

/* cabinet body */
var cabMesh = addBox(CL, CAB, CBL, cMat, 0, CAB / 2, 0);
var cabEdge = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(CL, CAB, CBL)),
  new THREE.LineBasicMaterial({ color: 0x3a3a55, transparent: true, opacity: 0.25 })
);
cabEdge.position.copy(cabMesh.position);
cg.add(cabEdge);

/* counter surface */
addBox(CL + 0.02, SFH, CBL + 0.02, sMat, 0, CAB + SFH / 2, 0);

/* walls */
var wallTopY = SY + WLH / 2;
addBox(CL + 0.02, WLH, WLT, wMat, 0, wallTopY, -CBL / 2 - 0.01 + WLT / 2);          // back
addBox(CL + 0.02, WLH * 0.55, WLT, wMat, 0, SY + WLH * 0.275, CBL / 2 + 0.01 - WLT / 2); // front (lower)
addBox(WLT, WLH, CBL + 0.04, wMat, -CL / 2 - 0.01 + WLT / 2, wallTopY, 0);            // left
addBox(WLT, WLH, CBL + 0.04, wMat, CL / 2 + 0.01 - WLT / 2, wallTopY, 0);             // right

/* zone dividers */
var divX1 = (ZDEFS[0].ex + ZDEFS[1].sx) / 2;
var divX2 = (ZDEFS[1].ex + ZDEFS[2].sx) / 2;
addBox(0.015, WLH * 0.85, CBL - 0.08, dMat, divX1, SY + WLH * 0.425, 0);
addBox(0.015, WLH * 0.85, CBL - 0.08, dMat, divX2, SY + WLH * 0.425, 0);

/* glass sneeze guard */
var glMat = new THREE.MeshStandardMaterial({
  color: 0xaaccff, transparent: true, opacity: 0.10,
  roughness: 0.04, metalness: 0.1, side: THREE.DoubleSide
});
addBox(CL + 0.02, 0.4, 0.008, glMat, 0, SY + 0.34, CBL / 2 + 0.015);
var railMat = new THREE.MeshStandardMaterial({ color: 0xccccdd, roughness: 0.2, metalness: 0.8 });
addBox(CL + 0.02, 0.015, 0.015, railMat, 0, SY + 0.54, CBL / 2 + 0.015);

/* ============ SLOTS & CONTAINERS ============ */
var slots = [];
var meshes = [];

ZDEFS.forEach(function(z, zi) {
  for (var r = 0; r < z.rows; r++) {
    for (var c = 0; c < z.cols; c++) {
      var x = z.sx + CW / 2 + c * CS;
      var zz = -(z.rows - 1) * RS / 2 + r * RS;
      slots.push({ pos: new THREE.Vector3(x, CY, zz), zi: zi });
    }
  }
});

slots.forEach(function(sl, i) {
  var z = ZDEFS[sl.zi];
  var col = new THREE.Color(z.color);
  var mat = new THREE.MeshStandardMaterial({
    color: col.clone().multiplyScalar(0.82),
    roughness: 0.34,
    metalness: 0.28,
    emissive: col.clone().multiplyScalar(0.06)
  });
  var m = new THREE.Mesh(new THREE.BoxGeometry(CW, CH, CD), mat);
  m.position.copy(sl.pos);
  m.castShadow = true;
  m.receiveShadow = true;
  m.userData = {
    id: i,
    si: i,
    zi: sl.zi,
    base: col.clone().multiplyScalar(0.82),
    emBase: col.clone().multiplyScalar(0.06)
  };

  /* edge lines */
  var eg = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(CW, CH, CD)),
    new THREE.LineBasicMaterial({ color: z.color, transparent: true, opacity: 0.35 })
  );
  m.add(eg);

  /* top highlight strip */
  var strip = new THREE.Mesh(
    new THREE.PlaneGeometry(CW - 0.04, CD - 0.04),
    new THREE.MeshBasicMaterial({ color: z.color, transparent: true, opacity: 0.06 })
  );
  strip.rotation.x = -Math.PI / 2;
  strip.position.y = CH / 2 + 0.001;
  m.add(strip);

  scene.add(m);
  meshes.push(m);
});

/* ============ ZONE LABELS ============ */
function mkLabel(txt, col, pos) {
  var cv = document.createElement("canvas");
  cv.width = 512;
  cv.height = 128;
  var ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, 512, 128);
  ctx.font = 'bold 40px "Noto Sans SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = col;
  ctx.shadowBlur = 12;
  ctx.fillStyle = col;
  ctx.fillText(txt, 256, 64);
  ctx.fillText(txt, 256, 64);
  var tex = new THREE.CanvasTexture(cv);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.position.copy(pos);
  sp.scale.set(2.2, 0.55, 1);
  scene.add(sp);
}

document.fonts.ready.then(function() {
  ZDEFS.forEach(function(z) {
    mkLabel(z.name, z.hex, new THREE.Vector3(z.cx, SY + WLH + 0.38, 0));
  });

  /* container number labels */
  meshes.forEach(function(m, i) {
    var cv = document.createElement("canvas");
    cv.width = 128;
    cv.height = 64;
    var ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, 128, 64);
    ctx.font = 'bold 22px "JetBrains Mono",monospace';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillText(String(i + 1), 64, 32);
    var tex = new THREE.CanvasTexture(cv);
    var label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    label.scale.set(CW * 0.45, CH * 0.7, 1);
    label.position.y = CH / 2 + 0.02;
    m.add(label);
  });
});

/* ============ DRAG SYSTEM ============ */
var ray = new THREE.Raycaster();
var mv = new THREE.Vector2();
var dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(CY + 0.15));
var dragging = false, dragObj = null, origSI = -1;
var dragOff = new THREE.Vector3();

/* slot highlight */
var hlMesh = new THREE.Mesh(
  new THREE.BoxGeometry(CW + 0.05, 0.006, CD + 0.05),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })
);
hlMesh.visible = false;
scene.add(hlMesh);

var hlRing = new THREE.Mesh(
  new THREE.RingGeometry(0.18, 0.22, 32),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
);
hlRing.rotation.x = -Math.PI / 2;
hlRing.visible = false;
scene.add(hlRing);

function mpos(e) {
  var r = renderer.domElement.getBoundingClientRect();
  mv.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mv.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function nearestSlot(p) {
  var best = -1, bd = 1e9;
  slots.forEach(function(s, i) {
    var dx = s.pos.x - p.x, dz = s.pos.z - p.z;
    var d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}

function containerAt(si) {
  for (var i = 0; i < meshes.length; i++) {
    if (meshes[i].userData.si === si) return meshes[i];
  }
  return null;
}

/* ============ ANIMATION SYSTEM ============ */
var anims = [];

function animTo(m, tp, dur, cb) {
  anims.push({ m: m, sp: m.position.clone(), tp: tp.clone(), dur: dur, el: 0, cb: cb });
}

function easeOut(t) {
  return 1 - Math.pow(1 - t, 3);
}

function updateAnim(dt) {
  for (var i = anims.length - 1; i >= 0; i--) {
    var a = anims[i];
    a.el += dt;
    var t = Math.min(a.el / a.dur, 1);
    var e = easeOut(t);
    a.m.position.lerpVectors(a.sp, a.tp, e);
    if (t >= 1) {
      a.m.position.copy(a.tp);
      if (a.cb) a.cb();
      anims.splice(i, 1);
    }
  }
}

/* ============ POINTER EVENTS ============ */
var tip = document.getElementById("tip");

renderer.domElement.addEventListener("pointerdown", function(e) {
  if (e.button !== 0) return;
  mpos(e);
  ray.setFromCamera(mv, camera);
  var hits = ray.intersectObjects(meshes);
  if (hits.length > 0) {
    dragging = true;
    dragObj = hits[0].object;
    origSI = dragObj.userData.si;
    var pt = hits[0].point;
    dragOff.set(dragObj.position.x - pt.x, 0, dragObj.position.z - pt.z);
    dragObj.material.emissive.set(0xffffff);
    dragObj.material.emissiveIntensity = 0.2;
    ctrl.enabled = false;
    renderer.domElement.style.cursor = "grabbing";
  }
});

renderer.domElement.addEventListener("pointermove", function(e) {
  mpos(e);

  if (dragging && dragObj) {
    ray.setFromCamera(mv, camera);
    var pi = new THREE.Vector3();
    ray.ray.intersectPlane(dragPlane, pi);
    if (pi) {
      dragObj.position.x = pi.x + dragOff.x;
      dragObj.position.z = pi.z + dragOff.z;
      dragObj.position.y = CY + 0.22;
      var ni = nearestSlot(dragObj.position);
      if (ni >= 0) {
        hlMesh.position.set(slots[ni].pos.x, SY + 0.003, slots[ni].pos.z);
        hlMesh.visible = true;
        hlRing.position.set(slots[ni].pos.x, SY + 0.004, slots[ni].pos.z);
        hlRing.visible = true;
        var s = 1 + Math.sin(Date.now() * 0.008) * 0.08;
        hlRing.scale.set(s, s, s);
      }
    }
    return;
  }

  /* hover effect */
  ray.setFromCamera(mv, camera);
  var hits = ray.intersectObjects(meshes);

  meshes.forEach(function(m) {
    m.material.emissive.copy(m.userData.emBase);
    m.material.emissiveIntensity = 1;
  });

  if (hits.length > 0) {
    var h = hits[0].object;
    h.material.emissive.copy(h.userData.base).multiplyScalar(0.2);
    renderer.domElement.style.cursor = "grab";
    var z = ZDEFS[h.userData.zi];
    tip.innerHTML = '<span style="color:' + z.hex + '">&#9632;</span> ' +
      z.name + ' #' + (h.userData.id + 1);
    tip.style.display = "block";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 10) + "px";
  } else {
    renderer.domElement.style.cursor = "default";
    tip.style.display = "none";
  }
});

renderer.domElement.addEventListener("pointerup", function(e) {
  if (!dragging || !dragObj) return;

  var ni = nearestSlot(dragObj.position);

  /* reset visual */
  dragObj.material.emissive.copy(dragObj.userData.emBase);
  dragObj.material.emissiveIntensity = 1;

  if (ni >= 0 && ni !== origSI) {
    var other = containerAt(ni);
    if (other) {
      var oldPos = slots[origSI].pos.clone();
      animTo(other, oldPos, 0.3);
      other.userData.si = origSI;
    }
    dragObj.userData.si = ni;
    animTo(dragObj, slots[ni].pos.clone(), 0.3);
  } else {
    animTo(dragObj, slots[origSI].pos.clone(), 0.22);
  }

  hlMesh.visible = false;
  hlRing.visible = false;
  dragging = false;
  dragObj = null;
  ctrl.enabled = true;
  renderer.domElement.style.cursor = "default";
});

/* ============ VIEW PRESETS ============ */
var views = {
  perspective: { p: new THREE.Vector3(6, 5, 8), t: new THREE.Vector3(0, 0.5, 0) },
  top:         { p: new THREE.Vector3(0.01, 10, 0.01), t: new THREE.Vector3(0, 0, 0) },
  front:       { p: new THREE.Vector3(0, 1.8, 8), t: new THREE.Vector3(0, 0.5, 0) },
  side:        { p: new THREE.Vector3(9, 2, 0), t: new THREE.Vector3(0, 0.5, 0) }
};

function flyTo(name) {
  var v = views[name];
  if (!v) return;
  var sp = camera.position.clone();
  var st = ctrl.target.clone();
  var startTime = performance.now();
  var duration = 600;

  function tick() {
    var elapsed = performance.now() - startTime;
    var t = Math.min(elapsed / duration, 1);
    var e = easeOut(t);
    camera.position.lerpVectors(sp, v.p, e);
    ctrl.target.lerpVectors(st, v.t, e);
    ctrl.update();
    if (t < 1) requestAnimationFrame(tick);
  }
  tick();
}

document.getElementById("btnPersp").addEventListener("click", function() { flyTo("perspective"); });
document.getElementById("btnTop").addEventListener("click", function() { flyTo("top"); });
document.getElementById("btnFront").addEventListener("click", function() { flyTo("front"); });
document.getElementById("btnSide").addEventListener("click", function() { flyTo("side"); });
document.getElementById("btnReset").addEventListener("click", function() {
  meshes.forEach(function(m) {
    animTo(m, slots[m.userData.id].pos.clone(), 0.5);
    m.userData.si = m.userData.id;
  });
});

/* ============ RENDER LOOP ============ */
var clock = new THREE.Clock();

(function loop() {
  requestAnimationFrame(loop);
  var dt = clock.getDelta();
  ctrl.update();
  updateAnim(dt);
  renderer.render(scene, camera);
})();

/* ============ RESIZE ============ */
window.addEventListener("resize", function() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

})();
</script>
</body>
</html>
