<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR 16,000 流体粒子系统 (三叶草与星云飘荡版)</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        #webcam {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            display: none;
            /* 隐藏原始摄像头画面 */
            z-index: -1;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.7);
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .gesture-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #004444;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 5px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 20px;
            z-index: 100;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>

    <div id="loading">高清 WebGL 流体场及手势模型初始化中...</div>
    <video id="webcam" autoplay playsinline></video>
    <div id="canvas3d"></div>

    <div id="ui-overlay">

        <div>粒子数量: <b>16,000</b></div>
        <div>当前手势: <span id="gesture-txt" class="gesture-badge">空中飘荡 (NONE)</span></div>
        <div>深度缩放: <span id="depth-txt">1.00</span></div>
        <div>风暴强度: <span id="storm-txt">0.00</span></div>
    </div>

    <script>
        // ==========================================
        // 1. 全局配置与参数定义
        // ==========================================
        const PARTICLE_COUNT = 16000;
        let scene, camera, renderer, instancedMesh;
        let videoElement, cameraHelper;
        let hands;

        // 粒子物理核心数据（结构化平面数组，优化GPU及内存交换性能）
        const pos = new Float32Array(PARTICLE_COUNT * 3);
        const targetPos = new Float32Array(PARTICLE_COUNT * 3);
        const vel = new Float32Array(PARTICLE_COUNT * 3);

        // 为“未检测到手势”时的自然飘荡引入一个粒子噪点偏移系数，使每个粒子飘荡路径不同
        const noiseOffsets = new Float32Array(PARTICLE_COUNT * 3);

        let currentGesture = "NONE";
        let lastGesture = "NONE";
        let handPresent = false;
        let handCenter = new THREE.Vector3();
        let lastHandCenter = new THREE.Vector3();
        let handSpeed = 0;
        let depthScale = 1.0;
        let targetDepthScale = 1.0;
        let globalTime = 0; // 全局时钟驱动

        // 离线 Canvas（用于文字采样）
        const textCanvas = document.createElement('canvas');
        const textCtx = textCanvas.getContext('2d');
        textCanvas.width = 256;
        textCanvas.height = 256;

        // ==========================================
        // 2. 形状几何与数学方程
        // ==========================================

        // 2.1 三叶草方程 (Trefoil Rose Formula)
        function getCloverPoint(t) {
            const theta = t * Math.PI * 2;
            // 三叶草的极坐标方程变换：r = a + b * cos(3 * theta)
            const r = 4.5 + 3.5 * Math.cos(3 * theta);

            // 引入轻微的厚度立体感 (Z轴)
            const z = (Math.random() - 0.5) * 1.5 * Math.sin(3 * theta);
            return new THREE.Vector3(
                r * Math.cos(theta),
                r * Math.sin(theta),
                z
            );
        }

        function getStarPoint(t) {
            const angle = t * Math.PI * 2 * 2;
            const r_star = 4 + 4 * Math.cos(5 * t * Math.PI * 2);
            return new THREE.Vector3(
                r_star * Math.cos(t * Math.PI * 2),
                r_star * Math.sin(t * Math.PI * 2),
                (Math.random() - 0.5) * 0.2
            );
        }

        function getHeartPoint(t) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = t * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(theta), 3) * Math.sin(phi);
            const y = (13 * Math.cos(theta) - 5 * Math.cos(2 * theta) - 2 * Math.cos(3 * theta) - Math.cos(4 * theta)) * Math.sin(phi);
            const z = 10 * Math.cos(phi);
            return new THREE.Vector3(x * 0.45, y * 0.45, z * 0.45);
        }

        function generateTextTargets(text) {
            textCtx.clearRect(0, 0, 256, 256);
            textCtx.fillStyle = '#ffffff';
            textCtx.font = 'bold 24px sans-serif';
            textCtx.textAlign = 'center';
            textCtx.textBaseline = 'middle';
            textCtx.fillText(text, 128, 128);

            const imgData = textCtx.getImageData(0, 0, 256, 256).data;
            const validPoints = [];
            for (let y = 0; y < 256; y += 1) {
                for (let x = 0; x < 256; x += 1) {
                    const idx = (y * 256 + x) * 4;
                    if (imgData[idx] > 100) {
                        validPoints.push(new THREE.Vector3(
                            (x - 128) * 0.09,
                            -(y - 128) * 0.09,
                            (Math.random() - 0.5) * 0.1
                        ));
                    }
                }
            }
            return validPoints;
        }

        const textPointsCache = generateTextTargets("cherry 小张张");

        // 2.2 手势形状动态映射分发器
        function transformToShape(shapeName) {
            currentGesture = shapeName;

            // 实时更新UI提示
            let uiText = shapeName;
            if (shapeName === "NONE") uiText = "空中飘荡 (NONE)";
            if (shapeName === "CLOVER_3") uiText = "三叶草绽放 (3FINGERS)";
            document.getElementById('gesture-txt').innerText = uiText;

            if (currentGesture !== lastGesture) {
                triggerExplosion();
                lastGesture = currentGesture;
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let p = new THREE.Vector3();
                const t = i / PARTICLE_COUNT;

                switch (shapeName) {
                    case "CLOVER_3": // 核心需求：3根手指变为三叶草
                        p = getCloverPoint(t);
                        break;
                    case "OPEN_HAND": // 张手：大爱心
                        p = getHeartPoint(t);
                        break;
                    case "VICTORY": // 剪刀手：文字
                        if (textPointsCache.length > 0) {
                            const cachedP = textPointsCache[i % textPointsCache.length];
                            p.set(cachedP.x, cachedP.y, cachedP.z);
                        }
                        break;
                    case "FIST": // 握拳：向核心致密收拢
                        const u = Math.random();
                        const v = Math.random();
                        const theta = u * 2.0 * Math.PI;
                        const phi = Math.acos(2.0 * v - 1.0);
                        const r = Math.cbrt(Math.random()) * 1.5;
                        p.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                        break;
                    case "INDEX_FINGER": // 食指：星星
                        p = getStarPoint(t);
                        break;
                    case "THUMB_UP": // 竖大拇指：精细小爱心
                        p = getHeartPoint(t).multiplyScalar(0.6);
                        break;
                    default:
                        // 基础飘荡态的目标位置由物理引擎在 animate 中接管实时更新，这里赋予一个初始散落范围
                        return;
                }

                targetPos[i * 3] = p.x;
                targetPos[i * 3 + 1] = p.y;
                targetPos[i * 3 + 2] = p.z;
            }
        }

        // 2.3 切换手势瞬间的物理爆炸特效
        function triggerExplosion() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const expForce = 20.0 + Math.random() * 25.0;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                vel[i * 3] += expForce * Math.sin(phi) * Math.cos(theta);
                vel[i * 3 + 1] += expForce * Math.sin(phi) * Math.sin(theta);
                vel[i * 3 + 2] += expForce * Math.cos(phi);
            }
        }

        // ==========================================
        // 3. Three.js 超清视口初始化
        // ==========================================
        function initThree() {
            const container = document.getElementById('canvas3d');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 24;

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            const pixelRatio = Math.min(window.devicePixelRatio, 3);
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 保持 0.05 保证高分辨率下的精细粒子沙画质感
            const geometry = new THREE.IcosahedronGeometry(0.05, 1);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, PARTICLE_COUNT);

            const dummy = new THREE.Object3D();
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // 初始化随机空间坐标
                pos[i * 3] = (Math.random() - 0.5) * 35;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 35;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 20;

                targetPos[i * 3] = pos[i * 3];
                targetPos[i * 3 + 1] = pos[i * 3 + 1];
                targetPos[i * 3 + 2] = pos[i * 3 + 2];

                // 飘荡专属：为每个粒子预先灌注独特的波形相位偏移值
                noiseOffsets[i * 3] = Math.random() * Math.PI * 2;
                noiseOffsets[i * 3 + 1] = Math.random() * Math.PI * 2;
                noiseOffsets[i * 3 + 2] = Math.random() * Math.PI * 2;

                dummy.position.set(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }

            scene.add(instancedMesh);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            const pixelRatio = Math.min(window.devicePixelRatio, 3);
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 4. MediaPipe 手势算法与多维状态机解算
        // ==========================================
        function initMediaPipe() {
            videoElement = document.getElementById('webcam');
            hands = new Hands({
                locateFile: (file) => `https://unpkg.com/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            cameraHelper = new Camera(videoElement, {
                onFrame: async () => { await hands.send({ image: videoElement }); },
                width: 640,
                height: 480
            });
            cameraHelper.start().then(() => {
                document.getElementById('loading').style.display = 'none';
            });
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handPresent = true;
                const landmarks = results.multiHandLandmarks[0];

                const wrist = landmarks[0];
                lastHandCenter.copy(handCenter);
                handCenter.set((wrist.x - 0.5) * -26, (wrist.y - 0.5) * -26, 0);

                const palmSize = getDistance(landmarks[0], landmarks[9]);
                targetDepthScale = THREE.MathUtils.mapLinear(palmSize, 0.2, 0.5, 0.7, 1.8);
                targetDepthScale = THREE.MathUtils.clamp(targetDepthScale, 0.6, 2.2);

                const distanceMoved = lastHandCenter.distanceTo(handCenter);
                handSpeed = distanceMoved * 0.4 + handSpeed * 0.6;

                // 精准解算 5 根手指的开关状态（基于关节垂直几何差）
                const isThumbOpen = landmarks[4].y < landmarks[3].y && landmarks[3].y < landmarks[5].y && landmarks[4].x < landmarks[2].x;
                const isIndexOpen = landmarks[8].y < landmarks[6].y;
                const isMiddleOpen = landmarks[12].y < landmarks[10].y;
                const isRingOpen = landmarks[16].y < landmarks[14].y;
                const isPinkyOpen = landmarks[20].y < landmarks[18].y;

                // 统计当前伸出的总手指数量
                const openedFingersCount = (isThumbOpen ? 1 : 0) + (isIndexOpen ? 1 : 0) + (isMiddleOpen ? 1 : 0) + (isRingOpen ? 1 : 0) + (isPinkyOpen ? 1 : 0);

                // 根据伸出手指数量和特定形态判别手势
                if (openedFingersCount === 3) {
                    // 核心需求：满足恰好有3根手指伸出，触发三叶草粒子特效
                    transformToShape("CLOVER_3");
                } else if (isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen) {
                    transformToShape("OPEN_HAND");
                } else if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                    transformToShape("VICTORY");
                } else if (openedFingersCount === 0 && !isThumbOpen) {
                    transformToShape("FIST");
                } else if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                    transformToShape("INDEX_FINGER");
                } else if (landmarks[4].y < landmarks[8].y && isThumbOpen && !isIndexOpen && !isMiddleOpen) {
                    transformToShape("THUMB_UP");
                } else {
                    // 处于非标模糊手势时，回退到基础飘荡态
                    transformToShape("NONE");
                }
            } else {
                handPresent = false;
                handSpeed *= 0.8;
                transformToShape("NONE");
            }
        }

        // ==========================================
        // 5. 核心流体物理引擎（包含流体风场飘荡算法）
        // ==========================================
        const dummy = new THREE.Object3D();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.025);
            globalTime += dt * 0.8; // 驱动流体时钟

            depthScale += (targetDepthScale - depthScale) * 0.15;
            document.getElementById('depth-txt').innerText = depthScale.toFixed(2);
            document.getElementById('storm-txt').innerText = handSpeed.toFixed(2);

            // 有手掌时，整体粒子系统轻微跟随手掌坐标倾斜拖拽
            if (handPresent) {
                instancedMesh.scale.set(depthScale, depthScale, depthScale);
                instancedMesh.position.lerp(new THREE.Vector3(handCenter.x * 0.25, handCenter.y * 0.25, 0), 0.1);
            } else {
                targetDepthScale = 1.0;
                instancedMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05);
                instancedMesh.position.lerp(new THREE.Vector3(0, 0, 0), 0.05);
            }

            // 单粒子物理微积分迭代
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                let px = pos[i3], py = pos[i3 + 1], pz = pos[i3 + 2];
                let vx = vel[i3], vy = vel[i3 + 1], vz = vel[i3 + 2];
                let tx = targetPos[i3], ty = targetPos[i3 + 1], tz = targetPos[i3 + 2];

                let ax = 0, ay = 0, az = 0;

                if (currentGesture === "NONE") {
                    // 💡 优化项：没有检测到手势或没有手时，计算全局三角波流体风场驱动粒子在空中柔和飘荡
                    const nX = noiseOffsets[i3];
                    const nY = noiseOffsets[i3 + 1];
                    const nZ = noiseOffsets[i3 + 2];

                    // 复杂的叠加三维正弦风力场模型，赋予粒子无规则、丝滑的流动惯性
                    const windX = Math.sin(globalTime * 0.5 + nY) * 2.5 + Math.cos(globalTime * 0.3 + nZ) * 1.5;
                    const windY = Math.cos(globalTime * 0.4 + nX) * 2.5 + Math.sin(globalTime * 0.6 + nZ) * 1.5;
                    const windZ = Math.sin(globalTime * 0.7 + nX) * 1.5;

                    // 处于飘荡状态时，粒子的吸引目标随风场动态更新扩散，防止聚拢
                    ax = windX;
                    ay = windY;
                    az = windZ;
                } else {
                    // 处于固定手势形状状态，应用强弹簧回归力
                    ax = (tx - px) * 34.0;
                    ay = (ty - py) * 34.0;
                    az = (tz - pz) * 34.0;
                }

                // 3. 挥手风暴交互机制 
                if (handPresent && handSpeed > 0.4) {
                    const hX = handCenter.x / depthScale;
                    const hY = handCenter.y / depthScale;
                    const dx = px - hX;
                    const dy = py - hY;
                    const dz = pz - 0;
                    const distSq = dx * dx + dy * dy + dz * dz + 0.1;

                    if (distSq < 160) {
                        const forceMagnitude = (handSpeed * 45.0) / distSq;
                        ax += dx * forceMagnitude;
                        ay += dy * forceMagnitude;
                        az += dz * forceMagnitude;
                    }
                }

                // 4. 速度与高阻尼平滑积分计算 (空中飘荡时使用弱阻尼，手势固形时使用强阻尼)
                const dampingCoeff = (currentGesture === "NONE") ? 2.0 : 5.5;
                const damping = Math.max(0.0, 1.0 - dampingCoeff * dt);
                vx = (vx + ax * dt) * damping;
                vy = (vy + ay * dt) * damping;
                vz = (vz + az * dt) * damping;

                // 5. 位置积分更新
                px += vx * dt;
                py += vy * dt;
                pz += vz * dt;

                // 飘荡态边界防溢出软约束（若飘出太远自动拉回宇宙中心）
                if (currentGesture === "NONE") {
                    const dSq = px * px + py * py + pz * pz;
                    if (dSq > 900) { // 超过限制半径
                        px *= 0.98; py *= 0.98; pz *= 0.98;
                    }
                }

                pos[i3] = px; pos[i3 + 1] = py; pos[i3 + 2] = pz;
                vel[i3] = vx; vel[i3 + 1] = vy; vel[i3 + 2] = vz;

                // 应用到 GPU 变换矩阵
                dummy.position.set(px, py, pz);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }

            instancedMesh.instanceMatrix.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // ==========================================
        // 6. 自动运行入口
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            initThree();
            initMediaPipe();
            animate();
        });
    </script>
</body>

</html>
